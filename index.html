<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>sensory-sound playground</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0c1018; color: #e8ecf4; margin: 0; padding: 24px; max-width: 900px; }
      h1 { font-weight: 300; margin: 0 0 4px; } p { color: #9aa5b8; }
      button { background: #1b2230; color: inherit; border: 1px solid #333c4d; border-radius: 8px; padding: 8px 12px; cursor: pointer; margin: 2px; }
      button.on { background: #2b4a46; border-color: #8fd6c8; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; align-items: center; }
      label { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; margin: 4px 0; font-size: 0.9rem; }
      input[type=range] { width: 100%; accent-color: #8fd6c8; }
      .meter { height: 6px; background: #1b2230; border-radius: 3px; overflow: hidden; margin: 12px 0; }
      .meter i { display: block; height: 100%; width: 0; background: #8fd6c8; }
      section { border: 1px solid #333c4d; border-radius: 12px; padding: 12px 16px; margin: 14px 0; }
      button.hush { border-color: #d9a066; } button.hush.on { background: #4a2b2b; border-color: #e88; }
      footer { color: #6b7488; font-size: 0.8rem; margin-top: 24px; }
      h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #9aa5b8; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <h1>sensory-sound</h1>
    <p>A playground for listening while developing. Everything you hear is synthesised live.</p>
    <div id="app"></div>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
